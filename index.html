<style>
/* Kirana Club design language, read from the live app and site (Nov 2026):
   red-orange brand, violet search header, lime price pill with dark outline, white cards, hard-edge buttons. */
:root{
  --or:#E04A26;--or-d:#B93A1B;--or-s:#FFEDE6;
  --pu:#8B4DF0;--pu-d:#5B21B6;--pu-s:#F1E9FF;
  --lime:#C8F169;--sky:#DFF2FB;
  --gr:#1E8E3E;--gr-s:#E3F6E8;--rd:#D23B2A;--rd-s:#FDE8E4;--am:#9A6100;--am-s:#FFF1CF;
  --ink:#17171C;--mut:#6C6C78;--line:#E4E4EA;--bg:#F5F4F1;--card:#FFFFFF;--card2:#F3F3F6;
  --f:'Plus Jakarta Sans','Noto Sans Devanagari',system-ui,-apple-system,'Segoe UI',sans-serif;--fd:'Plus Jakarta Sans','Noto Sans Devanagari',system-ui,sans-serif;
  --hard:0 2px 0 var(--ink);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font:14px/1.4 var(--f);color:var(--ink);background:#14141A}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0;transition:transform .1s ease,background .15s ease,border-color .15s ease,box-shadow .1s ease}
button:active{transform:translateY(1px)}
input{font:inherit;color:inherit}
.stage{min-height:100%;display:grid;grid-template-columns:minmax(240px,320px) 392px minmax(240px,320px);gap:40px;justify-content:center;align-items:center;padding:24px}
.side{color:#E8E6EE;align-self:center;max-height:820px;overflow:auto;scrollbar-width:none}
.side h1{font:800 26px/1.1 var(--f);margin:0 0 8px;letter-spacing:-.02em}
.side h2{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:#8A8799;margin:24px 0 10px;font-weight:800}
.side p{color:#A5A2B2;margin:0 0 10px;font-size:13px}
.jstep{display:flex;gap:12px;width:100%;text-align:left;padding:9px 10px;border-radius:12px;color:#C9C6D4;align-items:flex-start}
.jstep:hover{background:#1D1D25}
.jstep .n{flex:none;width:24px;height:24px;border-radius:50%;border:1.5px solid #3A3945;display:grid;place-items:center;font-size:11px;font-weight:800}
.jstep b{display:block;font-size:13px;font-weight:700;color:#F3F1F8}
.jstep span{font-size:12px;color:#8F8C9B}
.jstep.on{background:#20202A}
.jstep.on .n{background:var(--or);border-color:var(--or);color:#fff}
.seg{display:flex;background:#1D1D25;border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;padding:9px 6px;border-radius:9px;font-size:12.5px;font-weight:700;color:#A5A2B2}
.seg button.on{background:#fff;color:var(--ink)}
.sbtn{width:100%;padding:11px;border-radius:12px;border:1px solid #33323D;color:#E8E6EE;font-weight:700;font-size:13px;margin-top:8px}
.sbtn:hover{background:#1D1D25}
.chg{font-size:12.5px;color:#A5A2B2;padding:8px 0;border-top:1px solid #26262F}
.chg b{color:#fff}
.phone{width:392px;height:820px;background:#1B1B20;border-radius:48px;padding:9px;box-shadow:0 40px 100px rgba(0,0,0,.6),0 0 0 1px #33333C;position:relative}
#app{width:100%;height:100%;background:var(--bg);border-radius:40px;overflow:hidden;position:relative;display:flex;flex-direction:column}
#app>.enter{animation:scr .24s ease}
@keyframes scr{from{opacity:0;transform:translateY(8px)}}
.scr{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
.scr::-webkit-scrollbar,.side::-webkit-scrollbar,.catbar::-webkit-scrollbar,.hs::-webkit-scrollbar,.sug::-webkit-scrollbar,.log::-webkit-scrollbar{display:none}
@media(max-width:1040px){.stage{grid-template-columns:392px;gap:20px}.side{max-height:none}.phone{order:-1}}
@media(max-width:480px){body{background:var(--bg)}.stage{display:flex;flex-direction:column;gap:0;padding:0}.phone{width:100%;height:100dvh;border-radius:0;padding:0;box-shadow:none;background:none}#app{border-radius:0}.side{padding:24px 18px;background:#14141A}}

/* app chrome */
.top{background:var(--pu);color:#fff;padding:16px 14px 14px}
.top .who{display:flex;align-items:center;gap:10px}
.top .ava{flex:none;width:40px;height:40px;border-radius:50%;object-fit:cover;border:2px solid #fff}
.top .hi{font-size:17px;font-weight:800;letter-spacing:-.01em;line-height:1.15}
.top .sub{font-size:11.5px;opacity:.85;margin-top:2px}
.top .wal{margin-left:auto;flex:none;background:#fff;color:var(--ink);font-weight:800;font-size:12px;padding:7px 10px;border-radius:9px;border:1.5px solid var(--ink);box-shadow:var(--hard)}
.bar{display:flex;align-items:center;gap:12px;padding:16px 14px 12px;background:var(--bg);position:sticky;top:0;z-index:5}
.bar h3{margin:0;font-size:18px;font-weight:800;flex:1;letter-spacing:-.01em}
.back{width:38px;height:38px;border-radius:10px;background:#fff;border:1.5px solid var(--ink);box-shadow:var(--hard);display:grid;place-items:center}
.tabs{display:flex;background:#fff;border-top:1px solid var(--line);padding:6px 6px 12px}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;color:var(--mut);padding:7px 0;position:relative}
.tabs button.on{color:var(--or)}
.tabs .dot{position:absolute;top:3px;right:27%;width:8px;height:8px;border-radius:50%;background:var(--or);box-shadow:0 0 0 2px #fff}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.pad{padding:0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.h{font-size:16px;font-weight:800;margin:20px 14px 8px;display:flex;align-items:baseline;gap:8px;letter-spacing:-.01em}
.h small{font-weight:600;color:var(--mut);font-size:12px}
.cta{display:block;width:100%;background:var(--or);color:#fff;font-weight:800;font-size:16px;padding:15px;border-radius:12px;text-align:center;box-shadow:0 3px 0 var(--or-d)}
.cta:active{box-shadow:0 1px 0 var(--or-d);transform:translateY(2px)}
.cta.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--ink);box-shadow:var(--hard)}
.cta.pu{background:var(--pu);box-shadow:0 3px 0 var(--pu-d)}
.cta[disabled]{opacity:.4;box-shadow:none}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:800;padding:3px 8px;border-radius:6px}
.chip.g{background:var(--gr-s);color:var(--gr)}.chip.r{background:var(--rd-s);color:var(--rd)}.chip.a{background:var(--am-s);color:var(--am)}.chip.p{background:var(--pu-s);color:var(--pu-d)}
.mut{color:var(--mut)}.gr{color:var(--gr)}.b{font-weight:800}
.pp{display:inline-block;background:var(--lime);border:1.5px solid var(--ink);border-radius:7px;padding:1px 7px;font-weight:800;font-size:13px;line-height:1.35}
.mrp{color:#9A9AA5;font-size:11.5px;font-weight:600}

/* list rows */
.row{display:flex;gap:12px;padding:12px;align-items:center;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.art{flex:none;width:60px;height:60px;border-radius:10px;display:grid;place-items:center;background:#fff;overflow:hidden;border:1px solid var(--line)}
.art img{width:100%;height:100%;object-fit:contain;padding:4px;display:block}
.art.cv img{object-fit:cover;padding:0}
.art svg{width:40px;height:40px}
.art.off{filter:grayscale(1);opacity:.55}
.row .mid{flex:1;min-width:0}
.row .nm{font-weight:700;font-size:14.5px;line-height:1.25}
.row .pk{font-size:12px;color:var(--mut);margin-top:2px}
.row .pr{font-size:12.5px;margin-top:5px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.row .pr .mg{font-weight:800;font-size:12px}
.stp{flex:none;display:flex;align-items:center;border-radius:9px;overflow:hidden;background:#fff;border:1.5px solid var(--ink);box-shadow:var(--hard)}
.stp button{width:34px;height:38px;font-size:20px;font-weight:700;color:var(--or);display:grid;place-items:center}
.stp b{min-width:22px;text-align:center;font-size:15px;font-weight:800}
.addb{flex:none;color:var(--ink);font-weight:800;border-radius:9px;padding:9px 13px;font-size:13px;background:#fff;border:1.5px solid var(--ink);box-shadow:var(--hard)}
.search{display:flex;align-items:center;gap:8px;background:#fff;border-radius:10px;padding:0 6px 0 12px;height:48px;margin-top:12px;color:var(--mut)}
.search input{flex:1;border:0;outline:0;background:none;font-size:14px;min-width:0;color:var(--ink)}
.search input::placeholder{color:#9A9AA5}
.search button{width:38px;height:38px;border-radius:8px;background:var(--card2);color:var(--ink);display:grid;place-items:center}
.search button+button{background:var(--pu-s);color:var(--pu-d)}
.remind{margin:12px 14px 0;padding:16px;border-radius:14px;background:#fff;border:1.5px solid var(--ink);box-shadow:0 3px 0 var(--ink);display:flex;gap:12px;align-items:center;color:var(--ink)}
.remind .big{font-size:32px;font-weight:800;line-height:1.05;letter-spacing:-.02em;margin:4px 0 4px}
.catbar{display:flex;gap:8px;overflow-x:auto;padding:14px 14px 4px;scrollbar-width:none;position:sticky;top:0;background:var(--bg);z-index:4}
.catbar button{flex:none;padding:8px 13px;border-radius:8px;background:#fff;border:1px solid var(--line);font-weight:700;font-size:12.5px;color:var(--ink)}
.catbar button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.band{background:linear-gradient(90deg,var(--sky),#F4FBFF);margin:18px 0 10px;padding:10px 14px;display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px}
.band small{font-weight:600;color:var(--mut);font-size:12px}
.band a{margin-left:auto;color:var(--pu-d);font-weight:800;font-size:13px;text-decoration:underline}
.hs{display:flex;gap:10px;overflow-x:auto;padding:0 14px 6px;scrollbar-width:none}
.pc{flex:none;width:138px;padding:10px;border-radius:12px;background:#fff;border:1px solid var(--line)}
.pc .art{width:100%;height:96px;margin-bottom:8px;border:0}
.pc .nm{font-weight:700;font-size:13px;line-height:1.25;min-height:33px}
.dock{background:#fff;border-top:1px solid var(--line);padding:10px 14px 12px;display:flex;align-items:center;gap:12px}
.dock .t{flex:1;line-height:1.2}
.dock .t b{font-size:20px;font-weight:800;display:block;letter-spacing:-.01em}
.dock .t span{font-size:12px;color:var(--mut)}
.dock .cta{width:auto;padding:14px 20px;font-size:15px}
.fab{position:absolute;right:14px;z-index:8;background:var(--pu);color:#fff;font-weight:800;border-radius:99px;padding:9px 16px 9px 9px;display:flex;align-items:center;gap:9px;box-shadow:0 3px 0 var(--pu-d),0 10px 22px rgba(91,33,182,.35);font-size:13px}
.fab i{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.22);display:grid;place-items:center}
.fab svg{width:16px;height:16px}
.toast{position:absolute;left:50%;transform:translateX(-50%);top:12px;background:var(--ink);color:#fff;padding:11px 16px;border-radius:10px;font-weight:700;font-size:12.5px;z-index:30;white-space:nowrap;max-width:90%;overflow:hidden;text-overflow:ellipsis;animation:pop .25s ease;box-shadow:0 10px 24px rgba(0,0,0,.25)}
@keyframes pop{from{opacity:0;transform:translate(-50%,-12px)}}

/* onboarding + lock */
.lock{flex:1;position:relative;color:#fff;display:flex;flex-direction:column;padding:64px 16px 24px;background:#000 center/cover}
.lock::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,6,14,.35),rgba(8,6,14,.55) 45%,rgba(8,6,14,.92))}
.lock>*{position:relative}
.lock .time{font-size:74px;font-weight:700;line-height:1;text-align:center;letter-spacing:-.03em}
.lock .date{text-align:center;opacity:.85;margin:6px 0 40px;font-weight:600}
.notif{background:rgba(250,250,252,.94);border-radius:18px;padding:14px;text-align:left;width:100%;color:var(--ink);animation:pop2 .5s ease}
@keyframes pop2{from{opacity:0;transform:translateY(-14px)}}
.notif .app{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--mut);font-weight:800;letter-spacing:.05em;text-transform:uppercase}
.notif .lg{width:22px;height:22px;border-radius:6px;background:var(--or);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:800}
.notif b{display:block;font-size:15.5px;margin:10px 0 3px}
.notif p{margin:0;font-size:13.5px;color:#3D3D47}
.notif .go{margin-top:14px;background:var(--or);color:#fff;font-weight:800;border-radius:10px;padding:12px;text-align:center;box-shadow:0 3px 0 var(--or-d)}
.ob{flex:1;display:flex;flex-direction:column;padding:26px 18px 20px;background:#fff;overflow:auto;scrollbar-width:none}
.ob .hero{height:140px;border-radius:14px;background:#ddd center/cover;margin-bottom:20px;flex:none;border:1.5px solid var(--ink)}
.ob .stepdots{display:flex;gap:6px;margin-bottom:22px}
.ob .stepdots i{height:4px;flex:1;border-radius:4px;background:var(--line)}
.ob .stepdots i.on{background:var(--or)}
.ob h2{font-size:25px;line-height:1.15;margin:0 0 8px;font-weight:800;letter-spacing:-.02em}
.ob p{color:var(--mut);margin:0 0 20px;font-size:14px}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px;border-radius:12px;border:1.5px solid var(--line);margin-bottom:10px;background:#fff}
.opt.on{border-color:var(--ink);background:var(--or-s);box-shadow:var(--hard)}
.opt b{display:block;font-size:15.5px}
.opt span{font-size:12.5px;color:var(--mut)}
.opt .ic{flex:none;width:44px;height:44px;border-radius:10px;background:var(--pu-s);color:var(--pu-d);display:grid;place-items:center;font-weight:800;font-size:16px}
.fld{width:100%;border:1.5px solid var(--ink);background:#fff;border-radius:12px;padding:15px;font-size:17px;font-weight:700;outline:0;margin-bottom:12px;color:var(--ink)}
.fld::placeholder{color:#B4B4BE}
.fld:focus{box-shadow:0 0 0 3px var(--pu-s)}
.grow{flex:1}

/* call */
.call{flex:1;background:linear-gradient(180deg,#7C3AED,#3B1A86 55%,#1B103D);color:#fff;display:flex;flex-direction:column;min-height:0}
.call .hd{text-align:center;padding:26px 16px 10px}
.call .av{width:74px;height:74px;border-radius:50%;margin:0 auto 12px;background:#fff;display:grid;place-items:center;position:relative}
.call .av::after{content:"";position:absolute;inset:-9px;border-radius:50%;border:2px solid rgba(255,255,255,.35);animation:ring 1.6s ease-out infinite}
.call .av.lis::after{border-color:var(--lime);animation-duration:.8s}
@keyframes ring{from{transform:scale(.9);opacity:1}to{transform:scale(1.3);opacity:0}}
.call .av span{width:62px;height:62px;border-radius:50%;background:var(--or);color:#fff;display:grid;place-items:center;font-size:24px;font-weight:800}
.call .hd .nm{font-size:20px;font-weight:800}
.call .hd .st{font-size:12px;opacity:.8;margin-top:2px}
.log{flex:1;overflow-y:auto;padding:8px 14px;display:flex;flex-direction:column;gap:8px;scrollbar-width:none;min-height:0}
.bub{max-width:86%;padding:10px 13px;border-radius:14px;font-size:14px;line-height:1.38}
.log>:last-child{animation:pop2 .25s ease}
.bub.k{background:rgba(255,255,255,.16);align-self:flex-start;border-bottom-left-radius:4px}
.bub.u{background:#fff;color:var(--ink);align-self:flex-end;border-bottom-right-radius:4px;font-weight:600}
.slip{align-self:stretch;background:#fff;color:var(--ink);border-radius:14px;padding:4px 0;border:1.5px solid var(--ink)}
.slip .row{padding:9px 12px}
.slip .art{width:44px;height:44px;border-radius:8px}.slip .art svg{width:30px;height:30px}
.slip .stp button{height:32px;width:30px}
.slip .cap{font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--pu-d);padding:10px 12px 2px}
.sug{display:flex;gap:8px;overflow-x:auto;padding:8px 14px;scrollbar-width:none}
.sug button{flex:none;padding:9px 13px;border-radius:9px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);font-size:12.5px;font-weight:600;color:#fff}
.cin{display:flex;gap:8px;padding:4px 14px 10px}
.cin input{flex:1;min-width:0;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);border-radius:10px;padding:12px;color:#fff;outline:0}
.cin input::placeholder{color:rgba(255,255,255,.55)}
.cin button{width:46px;border-radius:10px;background:#fff;color:var(--pu-d);display:grid;place-items:center}
.cbtns{display:flex;justify-content:space-around;align-items:center;padding:6px 20px 24px}
.cb{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:11.5px;font-weight:700;color:#fff}
.cb i{width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.16);display:grid;place-items:center}
.cb.on i{background:#fff;color:var(--pu-d)}
.cb.mic i{width:68px;height:68px;background:var(--lime);color:var(--ink)}
.cb.mic.on i{background:#fff}
.cb.end i{background:var(--rd)}

/* review, orders */
.sum{display:flex;justify-content:space-between;padding:12px 14px;border-top:1px solid var(--line);font-size:14px}
.sum:first-child{border-top:0}
.pay{display:flex;gap:12px;align-items:center;padding:14px;border-radius:12px;border:1.5px solid var(--line);background:#fff;margin-bottom:8px;width:100%;text-align:left}
.pay.on{border-color:var(--ink);background:var(--or-s);box-shadow:var(--hard)}
.pay .rd{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid #B4B4BE;display:grid;place-items:center}
.pay.on .rd{border-color:var(--or)}.pay.on .rd::after{content:"";width:11px;height:11px;border-radius:50%;background:var(--or)}
.pay b{display:block;font-size:14.5px}.pay span{font-size:12px;color:var(--mut)}
.pay[disabled]{opacity:.45}
.ok{width:88px;height:88px;border-radius:50%;background:var(--lime);border:2px solid var(--ink);box-shadow:0 4px 0 var(--ink);display:grid;place-items:center;margin:38px auto 18px;color:var(--ink);animation:okp .5s cubic-bezier(.2,.9,.3,1.4)}
@keyframes okp{from{opacity:0;transform:scale(.4)}}
.ok svg{width:42px;height:42px;stroke-width:3}
.ttl{font-size:25px;font-weight:800;line-height:1.1;letter-spacing:-.02em}
.wa{background:#E2F8D4;border:1px solid #BFE6A6;border-radius:4px 14px 14px 14px;padding:11px 13px;font-size:13px;line-height:1.45;color:#16321A}
.track{display:flex;gap:12px;padding:0 14px 0}
.track .ln{display:flex;flex-direction:column;align-items:center}
.track .d{width:18px;height:18px;border-radius:50%;border:2px solid #C9C9D2;background:#fff;flex:none}
.track .d.on{background:var(--gr);border-color:var(--gr)}
.track .v{width:2px;flex:1;background:#DADAE2;min-height:24px}
.track .v.on{background:var(--gr)}
.track .tx{padding-bottom:18px;font-weight:700;font-size:14px}
.track .tx.off{color:#A5A5B0;font-weight:600}
.track .tx small{display:block;font-weight:500;color:var(--mut);font-size:12px}
.tri{display:flex;gap:4px;flex:none}

function stp(id){var n=q(id);return n>0?'<div class="stp"><button data-a="dec" data-id="'+id+'" aria-label="minus">−</button><b>'+n+'</b><button data-a="inc" data-id="'+id+'" aria-label="plus">+</button></div>':'<button class="addb" data-a="inc" data-id="'+id+'">+ '+L('जोड़ें','Add')+'</button>'}
function prow(p,slim){
  var n=q(p.id),flags='';
  if(p.oos){var a=by(p.alt);return '<div class="row">'+art(p).replace('class="art','class="art off')+'<div class="mid"><div class="nm" style="color:var(--mut)">'+nm(p)+'</div><div class="pr"><span class="chip r">'+L('अभी स्टॉक में नहीं','Out of stock')+'</span></div><div class="pk">'+L('बदले में: ','Swap for: ')+nm(a)+' · '+inr(a.price)+'</div></div>'+(q(a.id)>0&&S.swapped?'<span class="chip g">'+L('बदल दिया','Swapped')+'</span>':'<button class="addb" data-a="swap" data-id="'+p.id+'">'+L('बदल दें','Swap')+'</button>')+'</div>'}
  if(p.delta<0)flags+='<span class="chip g">'+inr(-p.delta)+' '+L('सस्ता हुआ','cheaper')+'</span>';
  if(p.delta>0)flags+='<span class="chip a">'+inr(p.delta)+' '+L('महंगा हुआ','costlier')+'</span>';
  var sc=SCH[p.id];if(sc)flags+=n>=sc[0]?'<span class="chip g">'+L('स्कीम लगी','Scheme applied')+'</span>':'<span class="chip p">'+L('स्कीम: ','Scheme: ')+L(sc[1],sc[2])+'</span>';
  var sl=SLAB[p.id];if(sl&&n>0)flags+=n>=sl[0]?'<span class="chip g">'+L('थोक भाव लगा','Bulk price on')+'</span>':'<span class="chip a">'+(sl[0]-n)+L(' और लें, हर '+un(p,1)+' पर '+inr(sl[1])+' कम',' more for '+inr(sl[1])+' off per '+un(p,1))+'</span>';
  return '<div class="row">'+art(p)+'<div class="mid"><div class="nm" data-a="item" data-id="'+p.id+'">'+nm(p)+'<span class="hist"> ›</span></div><div class="pk">'+pk(p)+' · '+un(p,1)+(!slim&&p.last?' · '+L('पिछली बार ','last time ')+p.last:'')+'</div><div class="pr"><b class="pp">'+inr(up(p))+'</b><span class="mrp">MRP '+inr(p.mrp)+'</span>'+(slim?'':'<span class="mg">'+inr(p.mrp-up(p))+' '+L('मार्जिन','margin')+'</span>')+flags+'</div></div>'+stp(p.id)+'</div>';
}

  if(a==='go'){if(S.screen==='call')endCall(true);S.screen=b.dataset.s;S.q='';S.item=null;if(S.screen==='home'&&S.adding&&!tot().c){}render()}
  else if(a==='inc'){S.cart[id]=q(id)+1;render()}
  else if(a==='dec'){S.cart[id]=q(id)-1;if(S.cart[id]<=0)delete S.cart[id];render()}
  else if(a==='swap'){var p=by(id);S.cart[p.alt]=Math.max(q(p.alt),p.last||1);S.swapped=true;render();toast(L(nm(by(p.alt))+' रख दी','Swapped to '+nm(by(p.alt))))}
  else if(a==='cat'){S.cat=v;render();var al=document.getElementById('allp'),sc=document.getElementById('scr');if(al&&sc)sc.scrollTop=al.offsetTop-4}
  else if(a==='again'){var o=S.past[+v],n=0;o.items.forEach(function(x){var p=by(x.id);var pid=p.oos?p.alt:x.id;if(p.oos)S.swapped=true;if(q(pid)<x.q){S.cart[pid]=x.q;n++}});if(S.screen!=='home')S.screen='home';render();toast(L(o.date+' वाला ऑर्डर कार्ट में · '+n+' आइटम',o.date+' order added to cart · '+n+' items'))}
  else if(a==='call'){startCall()}
  else if(a==='say'){heard(v)}
  else if(a==='sendc'){var i=document.getElementById('ci');heard(i.value)}
  else if(a==='mic'){mic()}
  else if(a==='vsearch'){vsearch()}
  else if(a==='sound'){S.sound=!S.sound;if(!S.sound&&window.speechSynthesis)speechSynthesis.cancel();render()}
  else if(a==='endcall'){endCall()}
  else if(a==='pay'){S.pay=v;render()}
  else if(a==='slot'){S.slot=+v;render()}
  else if(a==='place'){place()}
  else if(a==='editorder'){if(Date.now()>S.order.until)return;S.cart={};S.order.items.forEach(function(x){S.cart[x.id]=x.q});S.editing=true;S.screen='review';render()}
  else if(a==='next'){S.order.status++;render();if(S.order.status===3)toast(L('माल पहुँच गया','Goods delivered'))}
  else if(a==='chk'){S.order.chk[id]=v;render()}
  else if(a==='allok'){S.order.items.forEach(function(x){S.order.chk[x.id]='ok'});render()}
  else if(a==='closeorder'){closeOrder()}
  else if(a==='otab'){S.otab=v;render()}
  else if(a==='paykhata'){S.khata.log.unshift({t:'25 Nov',h:'UPI से चुकाया',e:'Paid by UPI',a:-S.khata.used});S.khata.used=0;render();toast(L('खाता चुकता हो गया','Khata settled'))}
  else if(a==='oblang'){S.obLang=v;S.lang=v;render()}
  else if(a==='sendotp'){var ph=document.getElementById('ph').value.replace(/\D/g,'');if(ph.length!==10){toast(L('10 अंक का नंबर डालें','Enter a 10 digit number'));return}S.phone=ph;S.screen='otp';render()}
  else if(a==='fillotp'){document.getElementById('otp').value='4821'}
  else if(a==='verify'){if(document.getElementById('otp').value.length!==4){toast(L('कोड डालें या SMS से भरें','Enter the code or fill from SMS'));return}S.screen='shop';render()}
  else if(a==='saveshop'){var sv=document.getElementById('shop').value.trim();if(!sv){toast(L('दुकान का नाम लिखें','Enter the shop name'));return}S.shop=sv;S.screen='home';render()}
  else if(a==='scan'){S.scan={mode:v,st:'cam',pick:null,from:S.screen};S.screen='scan';render()}
  else if(a==='scanback'){S.screen=S.scan.from;render()}
  else if(a==='shoot'){if(S.scan.st!=='cam')return;S.scan.st='scanning';render();setTimeout(function(){if(S.scan&&S.screen==='scan'){S.scan.st='done';render()}},1700)}
  else if(a==='scanpick'){S.scan.pick=+v;render()}
  else if(a==='scanapply'){if(S.scan.mode==='parchi'){var its=PAR.slice();if(S.scan.pick)its.push([S.scan.pick,1]);its.forEach(function(x){S.cart[x[0]]=x[1]});S.screen='review';render();toast(L('पर्ची के '+its.length+' आइटम कार्ट में आ गए','Added '+its.length+' items from your list'))}
    else{var bm=billMiss();S.order.items.forEach(function(x){S.order.chk[x.id]=x.id===bm?'short':'ok'});S.screen='check';render()}}
  else if(a==='vote'){S.vote=v;render()}
  else if(a==='like'){S.likes[v]=!S.likes[v];render()}
  else if(a==='ex'){S.ex=v;render()}
  else if(a==='exclose'){S.ex=null;S.item=null;if(window.speechSynthesis)speechSynthesis.cancel();render()}
  else if(a==='exsay'){speak(EX[S.ex][1][S.lang==='en'?1:0],true)}
  else if(a==='clear'){S.cart={};render()}
  else if(a==='item'){S.item=id;render()}
  else if(a==='buyagain'){S.cart[id]=Math.max(q(id),+v||1);S.item=null;render();toast(L('कार्ट में जुड़ गया','Added to cart'))}
  else if(a==='addmore'){S.adding=true;S.cart={};S.screen='home';render();toast(L('जो जोड़ना है चुनें, फिर कार्ट देखें','Pick what to add, then view cart'))}
  else if(a==='tour'){tourGo(+v)}
  else if(a==='wclose'){var ww=document.getElementById('welcome');if(ww)ww.remove()}
  else if(a==='jump'){TI=-1;jump(v)}
  else if(a==='mode'){TI=-1;fresh(v);render()}
  else if(a==='setlang'){S.lang=v;render()}
});
document.addEventListener('input',function(e){if(e.target.id==='sq'){S.q=e.target.value;var pos=e.target.selectionStart;render();var n=document.getElementById('sq');if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(x){}}}});
document.addEventListener('keydown',function(e){if(TI>=0&&!/INPUT|TEXTAREA/.test(e.target.tagName)){if(e.key==='ArrowRight')tourGo(TI+1);else if(e.key==='ArrowLeft'&&TI>0)tourGo(TI-1)}
  if(e.key==='Enter'&&e.target.id==='ci'){heard(e.target.value)}});

/* ---------- guided tour for reviewers ---------- */
var TI=-1,TS=[
 {t:'Products first',d:'Home is the product list: search, categories and every item with buying price, MRP and margin.',sel:'.cats',run:function(){fresh('old');S.screen='home'}},
 {t:'Order again',d:'His past orders, each added to the cart in one tap. No prediction, just what he bought.',sel:'.pc.ag',run:function(){S.screen='home'}},
 {t:'Every row, real numbers',d:'Lime price pill, MRP, margin, scheme and price change. Quantity changes in place.',sel:'#lw .card',run:function(){S.screen='home';S.cart[1]=6;S.cart[15]=2}},
 {t:'Item History',d:'Tap a product name: past buys with quantity and price each time.',sel:'.sheet',run:function(){S.screen='home';S.item=1}},
 {t:'Photo of a paper list',d:'He can keep writing his parchi. One photo and it is in the cart.',sel:'.paper',run:function(){S.scan={mode:'parchi',st:'cam',pick:null,from:'home'};S.screen='scan'}},
 {t:'Call Kari',d:'One button in the nav, with a slow pulse. He says his order like a phone call; Kari writes it with pictures. Tap a sample line.',sel:'.sug',run:function(){startCall()}},
 {t:'Cart and payment',d:'Schemes, bulk saving and wallet on one bill. Khata, UPI or cash. Savings and margin stay visible.',sel:'.savebar',run:function(){sampleCart();S.screen='review'}},
 {t:'Order placed',d:'ETA, a 2 minute edit window and a WhatsApp copy.',sel:'#scr .card',run:function(){ensureOrder();S.screen='placed'}},
 {t:'Track and add more',d:'Four plain statuses. More items can join the same delivery until dispatch.',sel:'[data-a=addmore]',run:function(){ensureOrder();S.order.status=0;S.otab='orders';S.screen='orders'}},
 {t:'Check the goods',d:'By bill photo or item by item. Short or damaged items come off the khata.',sel:'#scr .card',run:function(){ensureOrder(3);S.screen='check'}},
 {t:'Khata, inside Orders',d:'Month-end credit, like his distributor\'s ledger. One tab for orders and money.',sel:'.kh',run:function(){ensureOrder();S.otab='khata';S.screen='orders'}},
 {t:'Feed',d:'Mandi rates, the daily up-or-down question and posts from other shopkeepers. A tab, not the landing page.',sel:'#scr .card',run:function(){S.screen='feed'}},
 {t:'Hindi, one tap away',d:'Every screen in Hindi script. English and Hindi today; regional languages are coming.',sel:'.cats',run:function(){fresh('old');S.lang='hi';S.screen='home'}},
 {t:'His first order',d:'Switch to "First order" on the right: language, number, shop, then straight into products. That is the end of the tour.',sel:null,run:function(){fresh('old');S.lang='en';S.screen='home'}}];
function tourGo(i){var w=document.getElementById('welcome');if(w)w.remove();
  if(S.call)endCall(true);S.item=null;S.ex=null;S.adding=false;
  if(i<0||i>=TS.length){TI=-1;render();return}
  TI=i;TS[i].run();S.sound=false;if(S.screen!=='call')render();else renderSide()}
function spot(){if(TI<0||!TS[TI].sel)return;var e=document.querySelector('#app '+TS[TI].sel);if(!e)return;e.classList.add('spot');var sc=document.getElementById('scr');if(sc&&sc.contains(e)){var r=e.getBoundingClientRect(),c=sc.getBoundingClientRect();sc.scrollTop+=r.top-c.top-Math.max(20,(c.height-r.height)/2)}}
function tourHtml(){return TI>=0?'<div class="tour"><small>GUIDED TOUR · '+(TI+1)+' OF '+TS.length+'</small><b>'+TS[TI].t+'</b><p>'+TS[TI].d+'</p><div><button data-a="tour" data-v="'+(TI-1)+'" '+(TI?'':'disabled')+'>Back</button><button class="nx" data-a="tour" data-v="'+(TI+1)+'">'+(TI===TS.length-1?'Finish':'Next')+'</button><button data-a="tour" data-v="-1">Exit</button></div></div>':'<button class="tourb" data-a="tour" data-v="0">Start the guided tour · 2 minutes</button>'}
function welcome(){var d=document.createElement('div');d.id='welcome';d.innerHTML='<div class="bx"><small>KIRANA CLUB · UI/UX CASE STUDY</small><h2>Restocking for Ramesh</h2><p>A live prototype, not screenshots. Everything inside the phone can be tapped.</p><ul><li><b>Products first:</b> search, categories, order again.</li><li><b>Two journeys:</b> Ramesh\'s first order, and his monthly restock.</li><li><b>Kari:</b> one call button in the nav, for ordering by voice.</li><li><b>English and Hindi.</b> Regional languages are coming.</li></ul><button class="go" data-a="tour" data-v="0">Start the guided tour · 2 minutes</button><button class="sk" data-a="wclose">Explore on my own</button><a class="sk" href="deck.html" style="margin-top:6px;text-align:center">Read the case study deck</a></div>';document.body.appendChild(d)}

/* ---------- side panels + render ---------- */
var J=[['home','Products','Search, categories and the full list with price, margin and bulk price.'],['again','Order again','Past orders, back in the cart in one tap.'],['item','Item History','Tap a product name for past buys.'],['scan','Photo of a paper list','His handwritten parchi, read into the cart.'],['call','Call Kari','Say the order in Hindi or English. Kari writes it with pictures.'],['review','Cart and payment','Schemes, wallet, bulk saving. Khata, UPI or cash.'],['placed','Order placed','ETA, 2 minute edit window, WhatsApp copy.'],['orders','Track and add more','Four statuses. Add items until dispatch.'],['check','Check the goods','Bill photo or item by item. Short items refund to khata.'],['khata','Khata','Inside Orders. Month-end credit, like his distributor\'s ledger.'],['feed','Feed','Mandi rates and posts from other shopkeepers.']];
function curStep(){var s=S.screen;if(S.item)return 'item';if(['lang','phone','otp','shop'].indexOf(s)>=0)return 'onb';if(s==='orders'&&S.otab==='khata')return 'khata';if(s==='scan'&&S.scan&&S.scan.mode==='parchi')return 'scan';if(s==='scan')return 'check';return s}
function renderSide(){
  var cur=curStep();
  document.getElementById('journey').innerHTML='<h1>Restocking for Ramesh</h1><p>Live prototype v3. Every step is clickable in the phone. Jump to any step here.</p>'+tourHtml()+'<h2>Journey, end to end</h2>'+
   '<button class="jstep '+(cur==='onb'?'on':'')+'" data-a="jump" data-v="onb"><span class="n">0</span><span><b>First time setup</b><span>Language, number and shop. Then straight into products.</span></span></button>'+
   J.map(function(j,i){return '<button class="jstep '+(cur===j[0]?'on':'')+'" data-a="jump" data-v="'+j[0]+'"><span class="n">'+(i+1)+'</span><span><b>'+j[1]+'</b><span>'+j[2]+'</span></span></button>'}).join('');
  document.getElementById('ctrl').innerHTML='<h2 style="margin-top:0">Ramesh, 43 · Kanpur kirana</h2>'+[['new','1','First order','New to the app. Sets up, then orders from products, a photo or Kari.'],['old','2','Returning','His monthly restock. Order again, browse, pay on khata.']].map(function(x){return '<button class="jstep '+(S.mode===x[0]?'on':'')+'" data-a="mode" data-v="'+x[0]+'"><span class="n">'+x[1]+'</span><span><b>'+x[2]+'</b><span>'+x[3]+'</span></span></button>'}).join('')+
   '<h2>App language</h2><div class="seg"><button class="'+(S.lang==='en'?'on':'')+'" data-a="setlang" data-v="en">English</button><button class="'+(S.lang==='hi'?'on':'')+'" data-a="setlang" data-v="hi">हिन्दी</button></div><p style="margin-top:8px">Regional languages are coming soon.</p>'+
   '<button class="sbtn" data-a="mode" data-v="'+S.mode+'">Restart this journey</button>'+
   '<h2>How this version works</h2>'+
   '<div class="chg"><b>Products first.</b> Home is the catalogue, with search, categories and order again.</div>'+
   '<div class="chg"><b>Kari stays quiet.</b> One call button in the nav. No suggestions on screen.</div>'+
   '<div class="chg"><b>Numbers on every row.</b> Buying price, MRP, margin, bulk price, schemes.</div>'+
   '<div class="chg"><b>Credit he knows.</b> Khata works like his distributor\'s ledger.</div>'+
   '<div class="chg"><b>Feed is a tab.</b> Mandi rates and posts, never the landing page.</div>'+
   '<h2>Demo notes</h2><div class="chg">Prices, posts, rates and scan results are sample data. The voice parsing is real and runs in the browser.</div>';
}
var lastScr;
function render(){
  var sc=document.getElementById('scr'),keep=sc&&lastScr===S.screen?sc.scrollTop:0;
  document.getElementById('app').className=S.lang==='en'?'':'hi';
  document.getElementById('app').innerHTML=V[S.screen]()+sheetHtml();
  if(lastScr!==S.screen)[].forEach.call(document.getElementById('app').children,function(c){c.classList.add('enter')});
  var n=document.getElementById('scr');if(n)n.scrollTop=keep;
  var lg=document.getElementById('log');if(lg)lg.scrollTop=lg.scrollHeight;
  spot();lastScr=S.screen;renderSide();
}

},500);
